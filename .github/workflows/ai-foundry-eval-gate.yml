name: AI Foundry Model Evaluation & Regulation Gate

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  evaluate-models:
    name: Evaluate Content Safety, Groundedness & PHI Redaction
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Model Regulation Gate Tests
        run: |
          python -m pytest tests/test_safety_and_phi.py tests/test_groundedness_gate.py -v
